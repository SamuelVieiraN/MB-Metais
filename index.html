<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#084b58" />
    <title>Estoque &amp; Montagem</title>
    <meta name="description" content="Controle de estoque de peças e cálculo de montagem de torneiras, duchas e acessórios." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e7f'/%3E%3Cpath d='M16 6S9.5 13.4 9.5 18a6.5 6.5 0 0 0 13 0C22.5 13.4 16 6 16 6z' fill='%23fff'/%3E%3C/svg%3E" />

    <link rel="stylesheet" href="css/style.css" />

  <body data-screen="loading">
    <div id="boot" class="boot" aria-hidden="true"><span class="spinner big"></span></div>

    <div id="login-screen"></div>

    <div id="app">
      <aside id="sidebar" class="sidebar" aria-label="Menu principal">
        <div class="sb-head">
          <div class="brand">
            <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M16 3C16 3 6 14.2 6 20.5a10 10 0 0 0 20 0C26 14.2 16 3 16 3z" fill="currentColor" opacity=".95" />
              <path d="M11.5 20.8a4.6 4.6 0 0 0 4.2 4.4" fill="none" stroke="#0b4f5c" stroke-width="2" stroke-linecap="round" />
            </svg>
            <strong class="sb-label">Estoque &amp; Montagem</strong>
          </div>
          <button class="sb-toggle" data-action="sb-toggle" id="sb-toggle" aria-label="Recolher menu" title="Recolher ou expandir o menu"></button>
        </div>
        <div class="sb-section sb-label">Menu</div>
        <nav id="tabs" class="side-nav" aria-label="Seções"></nav>
        <div class="sb-bottom">
          <div id="userbox" class="userbox"></div>
        </div>
      </aside>
      <div id="sb-scrim" class="sb-scrim" data-action="sb-close"></div>
      <div class="shell">
        <header class="topbar">
          <button class="icon-top sb-open-btn" data-action="sb-open" aria-label="Abrir menu" id="sb-open"></button>
          <div class="top-title" id="top-title"></div>
          <div class="top-right" id="top-right"></div>
        </header>
        <div id="subtabs" class="subtabs-wrap"></div>
        <main id="view"></main>
        <footer class="foot" id="foot"></footer>
      </div>
    </div>

    <dialog id="modal"></dialog>
    <dialog id="confirm" class="confirm"></dialog>
    <dialog id="lightbox" class="lightbox"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="photo-input" accept="image/*" hidden />
    <input type="file" id="json-input" accept="application/json" hidden />

    <script src="js/config.js"></script>
    <script src="js/company.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/data.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/images.js"></script>
    <script src="js/xlsx-lite.js"></script>
    <script src="js/sheets.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/store.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
    <script src="js/views-sheets.js"></script>
    <script src="js/views-extra.js"></script>
    <script src="js/views-recebimento.js"></script>
    <script src="js/views-orders.js"></script>
    <script src="js/views-montados.js"></script>
    <script src="js/views-moves.js"></script>
    <script src="js/views-calendar.js"></script>
    <script src="js/views-hoje.js"></script>
    <script src="js/views-users.js"></script>
    <script src="js/views-loja.js"></script>
    <script src="js/views-security.js"></script>
    <script src="js/boot-app.js"></script>
